name: CodeQL

# CodeQL does not support PHP; this scans the GitHub Actions workflow files
# themselves (unpinned actions, script-injection via untrusted inputs, etc.).
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    - cron: '0 6 * * 1'

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (actions)
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v5

      - uses: github/codeql-action/init@v4
        with:
          languages: actions

      - uses: github/codeql-action/analyze@v4
        with:
          category: "/language:actions"
